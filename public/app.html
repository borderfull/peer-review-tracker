<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peer Review Tracker (Experimental)</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      /* warm parchment base */
      background: oklch(93.5% 0.018 74);
    }

    input:focus, textarea:focus {
      outline: 2px solid oklch(55% 0.140 32);
      outline-offset: 0;
      border-color: oklch(55% 0.140 32) !important;
    }

    button { transition: opacity 0.14s, background 0.15s; }
    button:not(:disabled):hover  { opacity: 0.87; }
    button:not(:disabled):active { opacity: 0.70; }

    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: oklch(82% 0.03 70); border-radius: 3px; }

    p, span, li { text-wrap: pretty; }

    /* Warm selection colour */
    ::selection { background: oklch(88% 0.06 38); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tracker-utils.jsx"></script>
  <script type="text/babel" src="tracker-parts.jsx"></script>
  <script type="text/babel" src="tracker-components.jsx"></script>
  <script type="text/babel" src="tracker-app.jsx"></script>
</body>
</html>
